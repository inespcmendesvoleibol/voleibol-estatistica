<!DOCTYPE html>

<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estatística de Voleibol</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #17202a;
    }

    header {
      background: #17202a;
      color: white;
      padding: 16px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin: 4px;
    }

    .primary {
      background: #1769aa;
      color: white;
    }

    .success {
      background: #2e8b57;
      color: white;
    }

    .danger {
      background: #c0392b;
      color: white;
    }

    .secondary {
      background: #e0e0e0;
    }

    .score {
      display: flex;
      justify-content: space-around;
      align-items: center;
      text-align: center;
      margin: 15px 0;
    }

    .score-team {
      width: 40%;
    }

    .score-number {
      font-size: 55px;
      font-weight: bold;
    }

    .vs {
      font-size: 18px;
      font-weight: bold;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .buttons button {
      margin: 0;
      min-height: 58px;
    }

    .players {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .player {
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 10px;
      background: white;
      cursor: pointer;
    }

    .player.active {
      border-color: #1769aa;
      background: #eaf4ff;
    }

    .hidden {
      display: none;
    }

    .stat-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    .stat-table th,
    .stat-table td {
      padding: 8px;
      border-bottom: 1px solid #ddd;
      text-align: center;
    }

    .stat-table th {
      background: #17202a;
      color: white;
    }

    .log {
      max-height: 250px;
      overflow-y: auto;
      font-size: 14px;
    }

    .log div {
      padding: 8px;
      border-bottom: 1px solid #eee;
    }

    @media (min-width: 700px) {
      .buttons {
        grid-template-columns: repeat(3, 1fr);
      }

      .players {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>

</head>

<body>

<header>
  <h1>🏐 Estatística de Voleibol</h1>
</header>

<div class="container">

  <div class="card" id="setup">

```
<h2>Novo jogo</h2>

<input id="teamName" placeholder="Nome da equipa">

<input id="opponentName" placeholder="Adversário">

<button class="primary" onclick="startGame()">
  Começar jogo
</button>
```

  </div>

  <div id="game" class="hidden">

```
<div class="card">

  <h2 id="gameTitle"></h2>

  <div class="score">

    <div class="score-team">
      <div id="teamDisplay">Equipa</div>
      <div class="score-number" id="scoreA">0</div>
      <button class="success" onclick="addPoint('A')">
        + Ponto
      </button>
    </div>

    <div class="vs">SET <span id="setNumber">1</span></div>

    <div class="score-team">
      <div id="opponentDisplay">Adversário</div>
      <div class="score-number" id="scoreB">0</div>
      <button class="danger" onclick="addPoint('B')">
        + Ponto
      </button>
    </div>

  </div>

  <button class="secondary" onclick="undo()">
    ↩ Desfazer última ação
  </button>

</div>


<div class="card">

  <h2>Jogadora</h2>

  <div class="players" id="players"></div>

  <br>

  <input id="playerNumber" type="number" placeholder="Número">

  <input id="playerName" placeholder="Nome da jogadora">

  <button class="primary" onclick="addPlayer()">
    + Adicionar jogadora
  </button>

</div>


<div class="card">

  <h2>Ação</h2>

  <div class="buttons">

    <button class="primary" onclick="action('Serviço +')">
      🏐 Serviço +
    </button>

    <button class="danger" onclick="action('Serviço -')">
      Serviço -
    </button>

    <button class="primary" onclick="action('Receção +')">
      🎯 Receção +
    </button>

    <button class="danger" onclick="action('Receção -')">
      Receção -
    </button>

    <button class="success" onclick="action('Ataque +')">
      ⚡ Ataque +
    </button>

    <button class="danger" onclick="action('Ataque -')">
      Ataque -
    </button>

    <button class="success" onclick="action('Bloco +')">
      🛡 Bloco +
    </button>

    <button class="danger" onclick="action('Bloco -')">
      Bloco -
    </button>

    <button class="secondary" onclick="action('Defesa +')">
      Defesa +
    </button>

    <button class="danger" onclick="action('Erro')">
      ✕ Erro
    </button>

  </div>

</div>


<div class="card">

  <h2>Registo do jogo</h2>

  <div class="log" id="log"></div>

</div>


<div class="card">

  <h2>Estatísticas</h2>

  <table class="stat-table">

    <thead>
      <tr>
        <th>Jogadora</th>
        <th>Serviço</th>
        <th>Receção</th>
        <th>Ataque</th>
        <th>Bloco</th>
        <th>Erros</th>
      </tr>
    </thead>

    <tbody id="stats"></tbody>

  </table>

</div>
```

  </div>

</div>

<script>

let game = {
  team: "",
  opponent: "",
  set: 1,
  scoreA: 0,
  scoreB: 0,
  players: [],
  selectedPlayer: null,
  actions: [],
  history: []
};


function startGame() {

  game.team = document.getElementById("teamName").value || "A nossa equipa";
  game.opponent = document.getElementById("opponentName").value || "Adversário";

  document.getElementById("setup").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");

  document.getElementById("gameTitle").innerText =
    game.team + " vs " + game.opponent;

  document.getElementById("teamDisplay").innerText = game.team;
  document.getElementById("opponentDisplay").innerText = game.opponent;

  save();
}


function addPlayer() {

  const number = document.getElementById("playerNumber").value;
  const name = document.getElementById("playerName").value;

  if (!number) {
    alert("Indique o número da jogadora.");
    return;
  }

  game.players.push({
    number: number,
    name: name || "Jogadora " + number,
    stats: {
      "Serviço +": 0,
      "Serviço -": 0,
      "Receção +": 0,
      "Receção -": 0,
      "Ataque +": 0,
      "Ataque -": 0,
      "Bloco +": 0,
      "Bloco -": 0,
      "Defesa +": 0,
      "Erro": 0
    }
  });

  document.getElementById("playerNumber").value = "";
  document.getElementById("playerName").value = "";

  renderPlayers();
  renderStats();
  save();
}


function renderPlayers() {

  const container = document.getElementById("players");

  container.innerHTML = "";

  game.players.forEach((player, index) => {

    const div = document.createElement("div");

    div.className = "player";

    if (game.selectedPlayer === index) {
      div.classList.add("active");
    }

    div.innerHTML =
      "<strong>#" + player.number + "</strong><br>" +
      player.name;

    div.onclick = function() {
      game.selectedPlayer = index;
      renderPlayers();
    };

    container.appendChild(div);
  });
}


function addPoint(team) {

  game.history.push({
    scoreA: game.scoreA,
    scoreB: game.scoreB
  });

  if (team === "A") {
    game.scoreA++;
  } else {
    game.scoreB++;
  }

  updateScore();

  save();
}


function updateScore() {

  document.getElementById("scoreA").innerText = game.scoreA;
  document.getElementById("scoreB").innerText = game.scoreB;
}


function action(type) {

  if (game.selectedPlayer === null) {
    alert("Selecione primeiro uma jogadora.");
    return;
  }

  const player = game.players[game.selectedPlayer];

  player.stats[type]++;

  const entry = {
    set: game.set,
    scoreA: game.scoreA,
    scoreB: game.scoreB,
    player: "#" + player.number + " " + player.name,
    action: type
  };

  game.actions.unshift(entry);

  renderLog();
  renderStats();
  save();
}


function renderLog() {

  const log = document.getElementById("log");

  log.innerHTML = "";

  game.actions.forEach(item => {

    const div = document.createElement("div");

    div.innerText =
      "Set " + item.set +
      " | " +
      item.scoreA + "-" + item.scoreB +
      " | " +
      item.player +
      " | " +
      item.action;

    log.appendChild(div);

  });
}


function renderStats() {

  const tbody = document.getElementById("stats");

  tbody.innerHTML = "";

  game.players.forEach(player => {

    const row = document.createElement("tr");

    row.innerHTML =
      "<td>#" + player.number + " " + player.name + "</td>" +
      "<td>" + player.stats["Serviço +"] + "/" + player.stats["Serviço -"] + "</td>" +
      "<td>" + player.stats["Receção +"] + "/" + player.stats["Receção -"] + "</td>" +
      "<td>" + player.stats["Ataque +"] + "/" + player.stats["Ataque -"] + "</td>" +
      "<td>" + player.stats["Bloco +"] + "/" + player.stats["Bloco -"] + "</td>" +
      "<td>" + player.stats["Erro"] + "</td>";

    tbody.appendChild(row);
  });
}


function undo() {

  if (game.history.length === 0) {
    return;
  }

  const previous = game.history.pop();

  game.scoreA = previous.scoreA;
  game.scoreB = previous.scoreB;

  updateScore();

  save();
}


function save() {

  localStorage.setItem(
    "voleibolGame",
    JSON.stringify(game)
  );

}


const saved = localStorage.getItem("voleibolGame");

if (saved) {

  try {

    game = JSON.parse(saved);

    if (game.team) {

      document.getElementById("setup").classList.add("hidden");
      document.getElementById("game").classList.remove("hidden");

      document.getElementById("gameTitle").innerText =
        game.team + " vs " + game.opponent;

      document.getElementById("teamDisplay").innerText =
        game.team;

      document.getElementById("opponentDisplay").innerText =
        game.opponent;

      updateScore();
      renderPlayers();
      renderStats();
      renderLog();

    }

  } catch (e) {}

}

</script>

</body>
</html>
